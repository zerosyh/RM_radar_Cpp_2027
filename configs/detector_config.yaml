# 路径使用相对于项目根目录的相对路径，代码会自动通过 paths.resolve_path() 解析为绝对路径
path:
  stage_one_path:  "model/TensorRT/car.engine"
  stage_two_path: "model/TensorRT/armor2_hku.engine"
  stage_three_path: "model/TensorRT/digit5.engine"
  tracker_path: "configs/botsort.yaml"


params:
  labels: ["1","2","3","4","S"]   # 5 类: 数字 1-4 + 哨兵 S(前哨站 Q 不参与)
  stage_one_conf: 0.57
  stage_two_conf: 0.5
  stage_three_conf: 0.5
  life_time: 90                       # 生命周期
  

# 推理/显示分辨率（detector_node 和 camera_detector 共用）
#resolution:
 # infer_width: 1280                   # 推理输入宽度
  #infer_height: 1280                 # 推理输入高度
  #display_width: 1920                 # 检测结果显示宽度
  #display_height: 1080                # 检测结果显示高度

# 坐标卡尔曼滤波器参数
filter:
  process_noise: 0.005         # 过程噪声系数（越小越平滑，响应越慢）
  measurement_noise: 0.15      # 观测噪声系数（越大越信赖预测值）
  jump_threshold: 1.0          # 单帧跳变阈值 (m)，超过则拒绝更新
  max_velocity: 5.0            # 最大移动速度 (m/s)，超过则拒绝观测
  max_inactive_time: 3.0       # 滤波器超时清理时间 (s)

is_record: true
record_fps: 60
